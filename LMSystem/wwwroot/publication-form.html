<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publication Form - LMSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarPlaceholder"></div>
  <div class="app-content">
    <div id="topbarPlaceholder"></div>
    <main class="page-main">
      <h2 class="fw-bold mb-4" id="formTitle">Add New</h2>
      <div class="card p-4" style="max-width: 560px;">
        <div class="form-card-header">
          <div class="icon-badge badge-lg badge-accent" id="formIcon"><i class="bi bi-newspaper"></i></div>
          <div>
            <h5 id="formSubtitle">New publication entry</h5>
            <p>Fields marked required must be filled before saving.</p>
          </div>
        </div>
        <div id="alertContainer"></div>
        <form id="pubForm" class="needs-validation" novalidate>
          <input type="hidden" id="pubId">
          <input type="hidden" id="pubType">
          <div class="mb-3">
            <label for="title" class="form-label"><i class="bi bi-type me-1"></i>Title</label>
            <input type="text" class="form-control" id="title" maxlength="100" required>
            <div class="invalid-feedback">Title is required.</div>
          </div>
          <div class="mb-3">
            <label for="publisher" class="form-label"><i class="bi bi-building me-1"></i>Publisher</label>
            <input type="text" class="form-control" id="publisher" maxlength="50" required>
            <div class="invalid-feedback">Publisher is required.</div>
          </div>
          <div class="mb-4">
            <label for="publishedDate" class="form-label"><i class="bi bi-calendar-date me-1"></i>Published Date</label>
            <input type="date" class="form-control" id="publishedDate" required>
            <div class="invalid-feedback">Published date is required.</div>
          </div>
          <div class="mb-4 form-check form-switch d-none" id="availabilityRow">
            <input class="form-check-input" type="checkbox" id="isAvailable">
            <label class="form-check-label fw-semibold" for="isAvailable">Mark item as active / available for borrowing</label>
          </div>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save Entry</button>
          <a href="#" class="btn btn-outline-secondary" id="cancelBtn"><i class="bi bi-arrow-left me-1"></i>Back to List</a>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
(async () => {
  await requireLogin();

  const type = (qs('type') === 'Magazine') ? 'Magazine' : 'Newspaper';
  renderShell(type === 'Magazine' ? 'magazines' : 'newspapers');
  document.getElementById('cancelBtn').href = `publications.html?type=${type}`;
  document.getElementById('pubType').value = type;
  document.getElementById('formIcon').className = `icon-badge badge-lg ${type === 'Magazine' ? 'badge-purple' : 'badge-info'}`;
  document.getElementById('formIcon').innerHTML = `<i class="bi ${type === 'Magazine' ? 'bi-journal-richtext' : 'bi-newspaper'}"></i>`;

  const editId = qs('id') ? Number(qs('id')) : null;

  if (editId) {
    try {
      const pub = await api.get(`/publications/${editId}`);
      document.getElementById('formTitle').textContent = `Modify ${type}`;
      document.getElementById('formSubtitle').textContent = `Update ${type.toLowerCase()} entry`;
      document.getElementById('pubId').value = pub.id;
      document.getElementById('title').value = pub.title;
      document.getElementById('publisher').value = pub.publisher;
      document.getElementById('publishedDate').value = pub.publishedDate;
      document.getElementById('isAvailable').checked = pub.isAvailable;
      document.getElementById('availabilityRow').classList.remove('d-none');
    } catch (err) {
      showAlert('alertContainer', err.message);
    }
  } else {
    document.getElementById('formTitle').textContent = `Add New ${type}`;
    document.getElementById('formSubtitle').textContent = `New ${type.toLowerCase()} entry`;
  }

  const form = document.getElementById('pubForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    form.classList.add('was-validated');
    if (!form.checkValidity()) return;

    const payload = {
      title: document.getElementById('title').value.trim(),
      publisher: document.getElementById('publisher').value.trim(),
      publishedDate: document.getElementById('publishedDate').value,
      type,
      isAvailable: document.getElementById('isAvailable').checked
    };

    try {
      if (editId) {
        await api.put(`/publications/${editId}`, payload);
      } else {
        await api.post('/publications', payload);
      }
      window.location.href = `publications.html?type=${type}`;
    } catch (err) {
      showAlert('alertContainer', err.message);
    }
  });
})();
</script>
</body>
</html>
