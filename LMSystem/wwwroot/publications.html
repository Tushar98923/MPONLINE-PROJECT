<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publications - LMSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarPlaceholder"></div>
  <div class="app-content">
    <div id="topbarPlaceholder"></div>
    <main class="page-main">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
        <h2 class="fw-bold m-0" id="pageTitle"><i class="bi bi-newspaper me-2"></i>Newspapers</h2>
        <div class="type-tabs" id="typeTabs">
          <a href="publications.html?type=Newspaper" data-type="Newspaper"><i class="bi bi-newspaper me-1"></i>Newspapers</a>
          <a href="publications.html?type=Magazine" data-type="Magazine"><i class="bi bi-journal-richtext me-1"></i>Magazines</a>
        </div>
      </div>

      <div id="alertContainer"></div>

      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <a href="#" id="addNewBtn" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add New</a>
        <form method="get" action="publications.html" class="d-flex search-bar gap-2 flex-wrap" id="searchForm">
          <input type="hidden" name="type" id="typeInput">
          <input type="text" name="searchString" id="searchInput" class="form-control" placeholder="Search by title or publisher...">
          <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search me-1"></i>Search</button>
          <a href="#" class="btn btn-link" id="clearLink"><i class="bi bi-x-circle me-1"></i>Clear</a>
        </form>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Title</th>
                <th>Publisher</th>
                <th>Published Date</th>
                <th>Availability</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="pubsBody"></tbody>
          </table>
        </div>
        <div class="card-footer bg-white border-0 py-3" id="pagination"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
(async () => {
  await requireLogin();

  const type = (qs('type') === 'Magazine') ? 'Magazine' : 'Newspaper';
  renderShell(type === 'Magazine' ? 'magazines' : 'newspapers');

  document.getElementById('pageTitle').innerHTML = `<i class="bi ${type === 'Magazine' ? 'bi-journal-richtext' : 'bi-newspaper'} me-2"></i>${type === 'Magazine' ? 'Magazines' : 'Newspapers'}`;
  document.querySelectorAll('#typeTabs a').forEach(a => a.classList.toggle('active', a.dataset.type === type));
  document.getElementById('addNewBtn').href = `publication-form.html?type=${type}`;
  document.getElementById('typeInput').value = type;

  const searchString = qs('searchString') || '';
  document.getElementById('searchInput').value = searchString;
  const clearLink = document.getElementById('clearLink');
  clearLink.href = `publications.html?type=${type}`;
  if (!searchString) clearLink.classList.add('d-none');

  function pageHref(page) {
    const params = new URLSearchParams();
    params.set('type', type);
    if (searchString) params.set('searchString', searchString);
    params.set('pageNumber', page);
    return `publications.html?${params.toString()}`;
  }

  async function render() {
    const body = document.getElementById('pubsBody');
    const icon = type === 'Magazine' ? 'bi-journal-x' : 'bi-newspaper';
    let data;
    try {
      const params = new URLSearchParams();
      params.set('type', type);
      if (searchString) params.set('searchString', searchString);
      params.set('page', qs('pageNumber') || '1');
      data = await api.get(`/publications?${params.toString()}`);
    } catch (err) {
      body.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="bi bi-exclamation-triangle"></i><h6>Could not load ${type.toLowerCase()}s</h6><p>${escapeHtml(err.message)}</p></div></td></tr>`;
      return;
    }

    if (data.items.length === 0) {
      body.innerHTML = `<tr><td colspan="5"><div class="empty-state"><i class="bi ${icon}"></i><h6>No ${type.toLowerCase()}s found</h6><p>${searchString ? 'Try a different search term or clear the filter.' : `Add a new ${type.toLowerCase()} to get started.`}</p></div></td></tr>`;
    } else {
      body.innerHTML = data.items.map(p => `
        <tr>
          <td>${escapeHtml(p.title)}</td>
          <td>${escapeHtml(p.publisher)}</td>
          <td>${escapeHtml(p.publishedDate)}</td>
          <td>${p.isAvailable
            ? '<span class="badge text-bg-success">Available</span>'
            : '<span class="badge text-bg-danger">Checked Out</span>'}</td>
          <td class="table-actions">
            <a href="publication-form.html?type=${type}&id=${p.id}" class="btn btn-sm btn-outline-primary" title="Edit"><i class="bi bi-pencil"></i></a>
            <button class="btn btn-sm btn-outline-danger" data-delete="${p.id}" title="Delete"><i class="bi bi-trash"></i></button>
          </td>
        </tr>`).join('');

      body.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Remove this publication from the collection?')) return;
          const id = Number(btn.dataset.delete);
          try {
            await api.del(`/publications/${id}`);
            render();
            showAlert('alertContainer', 'Publication deleted.', 'success');
          } catch (err) {
            showAlert('alertContainer', err.message);
          }
        });
      });
    }

    renderPagination('pagination', data.currentPage, data.totalPages, pageHref);
  }

  render();
})();
</script>
</body>
</html>
