<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Return Book - LMSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarPlaceholder"></div>
  <div class="app-content">
    <div id="topbarPlaceholder"></div>
    <main class="page-main">
      <h2 class="fw-bold mb-4">Return Book</h2>
      <div id="content" style="max-width: 560px;"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
(async () => {
  await requireLogin();
  renderShell('books');

  const recordId = qs('borrowRecordId') ? Number(qs('borrowRecordId')) : null;
  const content = document.getElementById('content');

  let record = null;
  if (recordId) {
    try {
      record = await api.get(`/borrow/${recordId}`);
    } catch (err) {
      record = null;
    }
  }

  if (!record) {
    content.innerHTML = `<div class="card p-4"><div class="empty-state"><i class="bi bi-exclamation-triangle"></i><h6>Borrow record not found</h6><p>Please check the link and try again.</p></div>
      <a href="books.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Books</a></div>`;
  } else if (record.returnDate) {
    content.innerHTML = `<div class="card p-4"><div class="empty-state"><i class="bi bi-check2-circle"></i><h6>Already returned</h6><p>This book has already been returned.</p></div>
      <a href="books.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Books</a></div>`;
  } else {
    content.innerHTML = `
      <div class="card p-4">
        <div class="form-card-header">
          <div class="icon-badge badge-lg badge-primary"><i class="bi bi-arrow-return-left"></i></div>
          <div>
            <h5>Return this book</h5>
            <p>Confirm the details below to check it back in.</p>
          </div>
        </div>
        <div id="alertContainer"></div>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-book me-1"></i>Book Title</label>
          <input type="text" class="form-control" value="${escapeHtml(record.bookTitle || '')}" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-person me-1"></i>Borrower Name</label>
          <input type="text" class="form-control" value="${escapeHtml(record.borrowerName)}" readonly>
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-calendar-event me-1"></i>Borrow Date</label>
          <input type="text" class="form-control" value="${escapeHtml(new Date(record.borrowDate).toLocaleString())}" readonly>
        </div>
        <button type="button" class="btn btn-success" id="confirmReturnBtn"><i class="bi bi-check2-circle me-1"></i>Confirm Return</button>
        <a href="books.html" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancel</a>
      </div>`;

    document.getElementById('confirmReturnBtn').addEventListener('click', async () => {
      try {
        await api.post(`/borrow/${recordId}/return`);
        window.location.href = 'books.html';
      } catch (err) {
        showAlert('alertContainer', err.message);
      }
    });
  }
})();
</script>
</body>
</html>
