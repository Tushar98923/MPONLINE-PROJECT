<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Books - LMSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarPlaceholder"></div>
  <div class="app-content">
    <div id="topbarPlaceholder"></div>
    <main class="page-main">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <h2 class="fw-bold m-0"><i class="bi bi-book me-2"></i>Books</h2>
        <a href="book-form.html" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Add New Book</a>
      </div>

      <div id="alertContainer"></div>

      <form method="get" action="books.html" class="d-flex search-bar gap-2 mb-3 flex-wrap">
        <input type="text" name="searchQuery" id="searchInput" class="form-control" placeholder="Search by title, author or ISBN...">
        <button type="submit" class="btn btn-outline-secondary"><i class="bi bi-search me-1"></i>Search</button>
        <a href="books.html" class="btn btn-link" id="clearLink"><i class="bi bi-x-circle me-1"></i>Clear</a>
      </form>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Published Date</th>
                <th>Available</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="booksBody"></tbody>
          </table>
        </div>
        <div class="card-footer bg-white border-0 py-3" id="pagination"></div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
(async () => {
  await requireLogin();
  renderShell('books');

  const searchQuery = qs('searchQuery') || '';
  document.getElementById('searchInput').value = searchQuery;
  if (!searchQuery) document.getElementById('clearLink').classList.add('d-none');

  function pageHref(page) {
    const params = new URLSearchParams();
    if (searchQuery) params.set('searchQuery', searchQuery);
    params.set('page', page);
    return `books.html?${params.toString()}`;
  }

  async function render() {
    const body = document.getElementById('booksBody');
    let data;
    try {
      const params = new URLSearchParams();
      if (searchQuery) params.set('searchQuery', searchQuery);
      params.set('page', qs('page') || '1');
      data = await api.get(`/books?${params.toString()}`);
    } catch (err) {
      body.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="bi bi-exclamation-triangle"></i><h6>Could not load books</h6><p>${escapeHtml(err.message)}</p></div></td></tr>`;
      return;
    }

    if (data.items.length === 0) {
      body.innerHTML = `<tr><td colspan="6"><div class="empty-state"><i class="bi bi-journal-x"></i><h6>No books found</h6><p>${searchQuery ? 'Try a different search term or clear the filter.' : 'Add your first book to get started.'}</p></div></td></tr>`;
    } else {
      body.innerHTML = data.items.map(book => {
        let actionBtn;
        if (book.isAvailable) {
          actionBtn = `<a href="borrow.html?bookId=${book.bookId}" class="btn btn-sm btn-success" title="Borrow"><i class="bi bi-journal-check"></i></a>`;
        } else if (book.activeBorrowRecordId) {
          actionBtn = `<a href="return.html?borrowRecordId=${book.activeBorrowRecordId}" class="btn btn-sm btn-secondary" title="Return"><i class="bi bi-arrow-return-left"></i></a>`;
        } else {
          actionBtn = `<span class="text-muted">-</span>`;
        }
        return `
          <tr>
            <td>${escapeHtml(book.title)}</td>
            <td>${escapeHtml(book.author)}</td>
            <td>${escapeHtml(book.isbn)}</td>
            <td>${escapeHtml(book.publishedDate)}</td>
            <td>${book.isAvailable
              ? '<span class="badge text-bg-success">Available</span>'
              : '<span class="badge text-bg-secondary">Borrowed</span>'}</td>
            <td class="table-actions">
              ${actionBtn}
              <a href="book-form.html?id=${book.bookId}" class="btn btn-sm btn-outline-primary" title="Edit"><i class="bi bi-pencil"></i></a>
              <button class="btn btn-sm btn-outline-danger" data-delete="${book.bookId}" title="Delete"><i class="bi bi-trash"></i></button>
            </td>
          </tr>`;
      }).join('');

      body.querySelectorAll('[data-delete]').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this book?')) return;
          const id = Number(btn.dataset.delete);
          try {
            await api.del(`/books/${id}`);
            showAlert('alertContainer', 'Book deleted.', 'success');
            render();
          } catch (err) {
            showAlert('alertContainer', err.message);
          }
        });
      });
    }

    renderPagination('pagination', data.currentPage, data.totalPages, pageHref);
  }

  render();
})();
</script>
</body>
</html>
