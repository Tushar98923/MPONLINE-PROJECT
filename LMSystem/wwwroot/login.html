<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - LMSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div class="auth-wrapper">
  <i class="bi bi-book-half auth-decor auth-decor-1" aria-hidden="true"></i>
  <i class="bi bi-journal-bookmark auth-decor auth-decor-2" aria-hidden="true"></i>
  <i class="bi bi-mortarboard auth-decor auth-decor-3" aria-hidden="true"></i>
  <i class="bi bi-newspaper auth-decor auth-decor-4" aria-hidden="true"></i>
  <div class="card auth-card p-4">
    <div class="auth-logo"><i class="bi bi-book-half"></i></div>
    <h3 class="mb-1 text-center fw-bold">LMSystem</h3>
    <p class="text-center text-muted mb-4">Library Management System</p>
    <div id="alertContainer"></div>
    <form id="loginForm" class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label"><i class="bi bi-person me-1"></i>Username</label>
        <input type="text" class="form-control" id="username" required>
        <div class="invalid-feedback">Username is required.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label"><i class="bi bi-lock me-1"></i>Password</label>
        <input type="password" class="form-control" id="password" required>
        <div class="invalid-feedback">Password is required.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
    </form>
    <div class="auth-hint mt-3">
      <i class="bi bi-info-circle text-primary"></i>
      <span class="text-muted small mb-0">Try <strong>admin</strong> / <strong>12345</strong></span>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
  (async () => {
    try {
      await api.get('/auth/me');
      window.location.href = 'home.html';
    } catch (err) {
      // not logged in - stay on the login page
    }
  })();

  const form = document.getElementById('loginForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    form.classList.add('was-validated');
    if (!form.checkValidity()) return;

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const submitBtn = form.querySelector('button[type=submit]');
    submitBtn.disabled = true;

    try {
      await api.post('/auth/login', { username, password });
      window.location.href = 'home.html';
    } catch (err) {
      showAlert('alertContainer', err.message || 'Login Failed. Invalid username or password.');
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
