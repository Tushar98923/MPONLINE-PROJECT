<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Borrow Book - LMSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarPlaceholder"></div>
  <div class="app-content">
    <div id="topbarPlaceholder"></div>
    <main class="page-main">
      <h2 class="fw-bold mb-4">Borrow Book</h2>
      <div id="content" style="max-width: 560px;"></div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
(async () => {
  await requireLogin();
  renderShell('books');

  const bookId = qs('bookId') ? Number(qs('bookId')) : null;
  const content = document.getElementById('content');

  let book = null;
  if (bookId) {
    try {
      book = await api.get(`/books/${bookId}`);
    } catch (err) {
      book = null;
    }
  }

  if (!book) {
    content.innerHTML = `<div class="card p-4"><div class="empty-state"><i class="bi bi-exclamation-triangle"></i><h6>Book not found</h6><p>It may have been removed from the catalog.</p></div>
      <a href="books.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Books</a></div>`;
  } else if (!book.isAvailable) {
    content.innerHTML = `<div class="card p-4"><div class="empty-state"><i class="bi bi-lock"></i><h6>Not available</h6><p>This book is currently checked out.</p></div>
      <a href="books.html" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back to Books</a></div>`;
  } else {
    content.innerHTML = `
      <div class="card p-4">
        <div class="form-card-header">
          <div class="icon-badge badge-lg badge-success"><i class="bi bi-journal-check"></i></div>
          <div>
            <h5>Borrow this book</h5>
            <p>Enter your details to check it out.</p>
          </div>
        </div>
        <div id="alertContainer"></div>
        <form id="borrowForm" class="needs-validation" novalidate>
          <div class="mb-3">
            <label class="form-label"><i class="bi bi-book me-1"></i>Book Title</label>
            <input type="text" class="form-control" value="${escapeHtml(book.title)}" readonly>
          </div>
          <div class="mb-3">
            <label for="borrowerName" class="form-label"><i class="bi bi-person me-1"></i>Your Name</label>
            <input type="text" class="form-control" id="borrowerName" maxlength="100" required>
            <div class="invalid-feedback">Your name is required.</div>
          </div>
          <div class="mb-3">
            <label for="borrowerEmail" class="form-label"><i class="bi bi-envelope me-1"></i>Your Email</label>
            <input type="email" class="form-control" id="borrowerEmail" required>
            <div class="invalid-feedback">Invalid email address.</div>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label"><i class="bi bi-telephone me-1"></i>Phone Number</label>
            <input type="tel" class="form-control" id="phone" pattern="^[0-9+\\(\\)\\s\\-]{7,20}$" required>
            <div class="invalid-feedback">Invalid phone number.</div>
          </div>
          <button type="submit" class="btn btn-success"><i class="bi bi-journal-check me-1"></i>Borrow</button>
          <a href="books.html" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancel</a>
        </form>
      </div>`;

    document.getElementById('borrowForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const form = e.target;
      form.classList.add('was-validated');
      if (!form.checkValidity()) return;

      const payload = {
        bookId,
        borrowerName: document.getElementById('borrowerName').value.trim(),
        borrowerEmail: document.getElementById('borrowerEmail').value.trim(),
        phone: document.getElementById('phone').value.trim()
      };

      try {
        await api.post('/borrow', payload);
        window.location.href = 'books.html';
      } catch (err) {
        showAlert('alertContainer', err.message);
      }
    });
  }
})();
</script>
</body>
</html>
