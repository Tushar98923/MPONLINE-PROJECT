<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us - LMSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarPlaceholder"></div>
  <div class="app-content">
    <div id="topbarPlaceholder"></div>
    <main class="page-main">
      <h2 class="fw-bold mb-4"><i class="bi bi-envelope me-2"></i>Contact Us</h2>

      <div class="row g-4">
        <div class="col-md-5">
          <div class="card p-4 h-100">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="icon-badge badge-primary"><i class="bi bi-geo-alt"></i></div>
              <div>
                <h6 class="mb-0 fw-bold">Front Desk</h6>
                <span class="text-muted small">Main Library Building, Room 101</span>
              </div>
            </div>
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="icon-badge badge-success"><i class="bi bi-telephone"></i></div>
              <div>
                <h6 class="mb-0 fw-bold">Phone</h6>
                <span class="text-muted small">+91 90000 00000</span>
              </div>
            </div>
            <div class="d-flex align-items-center gap-3">
              <div class="icon-badge badge-accent"><i class="bi bi-envelope"></i></div>
              <div>
                <h6 class="mb-0 fw-bold">Email</h6>
                <span class="text-muted small">support@lmsystem.example</span>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-7">
          <div class="card p-4">
            <div class="form-card-header">
              <div class="icon-badge badge-lg badge-purple"><i class="bi bi-chat-dots"></i></div>
              <div>
                <h5 class="mb-0">Send us a message</h5>
                <p>We usually reply within one business day.</p>
              </div>
            </div>
            <div id="contactAlert"></div>
            <form id="contactForm" class="needs-validation" novalidate>
              <div class="mb-3">
                <label for="contactName" class="form-label"><i class="bi bi-person me-1"></i>Your Name</label>
                <input type="text" class="form-control" id="contactName" required>
                <div class="invalid-feedback">Please enter your name.</div>
              </div>
              <div class="mb-3">
                <label for="contactEmail" class="form-label"><i class="bi bi-envelope me-1"></i>Your Email</label>
                <input type="email" class="form-control" id="contactEmail" required>
                <div class="invalid-feedback">Please enter a valid email.</div>
              </div>
              <div class="mb-3">
                <label for="contactMessage" class="form-label"><i class="bi bi-chat-left-text me-1"></i>Message</label>
                <textarea class="form-control" id="contactMessage" rows="4" required></textarea>
                <div class="invalid-feedback">Please enter a message.</div>
              </div>
              <button type="submit" class="btn btn-primary"><i class="bi bi-send me-1"></i>Send Message</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
(async () => {
  await requireLogin();
  renderShell('contact');

  const form = document.getElementById('contactForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    form.classList.add('was-validated');
    if (!form.checkValidity()) return;

    const payload = {
      name: document.getElementById('contactName').value.trim(),
      email: document.getElementById('contactEmail').value.trim(),
      message: document.getElementById('contactMessage').value.trim()
    };

    try {
      const res = await api.post('/contact', payload);
      showAlert('contactAlert', res.message, 'success');
      form.reset();
      form.classList.remove('was-validated');
    } catch (err) {
      showAlert('contactAlert', err.message);
    }
  });
})();
</script>
</body>
</html>
