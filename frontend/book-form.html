<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Form - LMSystem</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/site.css" rel="stylesheet">
</head>
<body>
<div class="app-shell">
  <div id="sidebarPlaceholder"></div>
  <div class="app-content">
    <div id="topbarPlaceholder"></div>
    <main class="page-main">
      <h2 class="fw-bold mb-4" id="formTitle">Add Book</h2>
      <div id="alertContainer" style="max-width: 560px;"></div>
      <div class="card p-4" style="max-width: 560px;">
        <div class="form-card-header">
          <div class="icon-badge badge-lg badge-primary" id="formIcon"><i class="bi bi-journal-plus"></i></div>
          <div>
            <h5 id="formSubtitle">New catalog entry</h5>
            <p>Fields marked required must be filled before saving.</p>
          </div>
        </div>
        <form id="bookForm" class="needs-validation" novalidate>
          <input type="hidden" id="bookId">
          <div class="mb-3">
            <label for="title" class="form-label"><i class="bi bi-type me-1"></i>Title</label>
            <input type="text" class="form-control" id="title" maxlength="100" required>
            <div class="invalid-feedback">The Title field is required.</div>
          </div>
          <div class="mb-3">
            <label for="author" class="form-label"><i class="bi bi-person me-1"></i>Author</label>
            <input type="text" class="form-control" id="author" maxlength="100" required>
            <div class="invalid-feedback">The Author field is required.</div>
          </div>
          <div class="mb-3">
            <label for="isbn" class="form-label"><i class="bi bi-upc-scan me-1"></i>ISBN</label>
            <input type="text" class="form-control" id="isbn" pattern="\d{3}-\d{10}" placeholder="XXX-XXXXXXXXXX" required>
            <div class="invalid-feedback">ISBN must be in the format XXX-XXXXXXXXXX.</div>
          </div>
          <div class="mb-4">
            <label for="publishedDate" class="form-label"><i class="bi bi-calendar-date me-1"></i>Published Date</label>
            <input type="date" class="form-control" id="publishedDate" required>
            <div class="invalid-feedback">The Published Date field is required.</div>
          </div>
          <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Save</button>
          <a href="books.html" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancel</a>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui.js"></script>
<script>
(async () => {
  await requireLogin();
  renderShell('books');

  const editId = qs('id') ? Number(qs('id')) : null;

  if (editId) {
    try {
      const book = await api.get(`/books/${editId}`);
      document.getElementById('formTitle').textContent = 'Edit Book';
      document.getElementById('formSubtitle').textContent = 'Update catalog entry';
      document.getElementById('formIcon').innerHTML = '<i class="bi bi-pencil-square"></i>';
      document.getElementById('bookId').value = book.bookId;
      document.getElementById('title').value = book.title;
      document.getElementById('author').value = book.author;
      document.getElementById('isbn').value = book.isbn;
      document.getElementById('publishedDate').value = book.publishedDate;
    } catch (err) {
      showAlert('alertContainer', err.message);
    }
  }

  const form = document.getElementById('bookForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    form.classList.add('was-validated');
    if (!form.checkValidity()) return;

    const payload = {
      title: document.getElementById('title').value.trim(),
      author: document.getElementById('author').value.trim(),
      isbn: document.getElementById('isbn').value.trim(),
      publishedDate: document.getElementById('publishedDate').value
    };

    try {
      if (editId) {
        await api.put(`/books/${editId}`, payload);
      } else {
        await api.post('/books', payload);
      }
      window.location.href = 'books.html';
    } catch (err) {
      showAlert('alertContainer', err.message);
    }
  });
})();
</script>
</body>
</html>
